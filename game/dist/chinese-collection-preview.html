<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Wonderseeker 中国奇物 · 1～7级</title><style>body{margin:0;padding:24px;background:#102b3c;color:#ffedbe;font:18px system-ui}h1{font-size:30px}p{color:#a8c9cf}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}article{background:#1c4052;border:1px solid #496677;border-radius:20px;padding:18px;text-align:center}img{width:100%;height:210px;object-fit:contain}small{color:#9db7c1}h2{font-size:21px;margin:8px}</style><h1>中国奇物 · 古意与旧时光</h1><p>1～7级 · 古代六件＋现代三件 · 已接入掉落、仓库、图鉴与展柜</p><main></main><script type="module">import {makeItems} from './content.js';const e=await(await fetch('./economy.json')).json();document.querySelector('main').innerHTML=Object.values(makeItems(e)).filter(i=>i.texture?.includes('/china-')).map(i=>`<article><small>LEVEL ${i.grade} · ${i.footprint.join(' × ')} 格</small><img src="${i.texture}"><h2>${i.name}</h2></article>`).join('');</script></html>
