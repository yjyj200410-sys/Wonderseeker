<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特殊揭示动画预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:white;font-family:"Microsoft YaHei",sans-serif}button{font:inherit;color:inherit;cursor:pointer}#scene{position:fixed;inset:0;overflow:hidden;background:#020611 url("./assets/ui/reveal-starfield.svg") center/cover no-repeat;isolation:isolate;outline-offset:-4px;cursor:pointer}.previous{position:absolute;inset:0;background:#bd2038;display:grid;place-items:center}.previous img,.reward img{width:min(40vmin,330px);height:min(40vmin,330px);object-fit:contain;filter:drop-shadow(0 10px 18px #0006)}.previous small{position:absolute;top:22%;color:#fff9}.rainbow{position:absolute;left:50%;top:50%;width:300vmax;height:300vmax;border-radius:50%;background:conic-gradient(from 20deg,#ff4667,#ffcc42,#54eda2,#49caff,#925bff,#ff70cc,#ff4667);transform:translate(-50%,-50%);z-index:0}.rainbow::after{content:"";position:absolute;left:50%;top:50%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);background:conic-gradient(from 20deg,#ff4667,#ffcc42,#54eda2,#49caff,#925bff,#ff70cc,#ff4667);filter:blur(14px);-webkit-mask-image:radial-gradient(circle,#000 0%,#000 18%,transparent 68%);mask-image:radial-gradient(circle,#000 0%,#000 18%,transparent 68%);pointer-events:none}.ex-focus{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 8%,#0b062c55 42%,#030414dd 100%);z-index:1;pointer-events:none;animation:focus-in .3s ease-out both}.ex-energy-core{position:absolute;left:50%;top:50%;width:9vmin;height:9vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff 20%,#bfeaff99 45%,transparent 72%);box-shadow:0 0 5vmin #b5dfff99;animation:core-breathe 1.2s ease-in-out infinite}.ex-energy-ring{position:absolute;left:50%;top:50%;width:44vmin;height:44vmin;border:2px solid #eefaff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 18px #a3d9ff,inset 0 0 16px #a3d9ff88;animation:energy-contract .3s ease-out both}.energy-cloud .ex-energy-core{width:23vmin;height:23vmin;background:radial-gradient(circle,#fff 0%,#fffffff2 15%,#e9f7ff99 36%,#c4eaff33 55%,transparent 72%);filter:blur(3px);animation:cloud-pulse 1s ease-in-out infinite}.energy-wave{position:absolute;left:50%;top:50%;width:20vmin;height:20vmin;border:2px solid #ffffffbb;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 18px #fff8;animation:cloud-wave 1.5s ease-out infinite}.energy-wave.delayed{animation-delay:-.75s}@keyframes cloud-pulse{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.8}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}@keyframes cloud-wave{from{transform:translate(-50%,-50%) scale(.75);opacity:.8}to{transform:translate(-50%,-50%) scale(2.8);opacity:0}}.ex-burst{position:absolute;inset:0;background:#fff;opacity:0;z-index:3;pointer-events:none;animation:burst .3s ease-out both}@keyframes focus-in{from{opacity:0}to{opacity:1}}@keyframes energy-contract{0%{width:150vmax;height:150vmax;opacity:1}100%{width:0;height:0;opacity:1}}.energy-point{position:absolute;left:50%;top:50%;width:1.3vmin;height:1.3vmin;min-width:5px;min-height:5px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 0 1.2vmin .3vmin #e5f5ff99;opacity:0;animation:point-appear .01s linear .3s forwards,point-breathe 1s ease-in-out .3s infinite}.energy-point::before{content:"";position:absolute;left:50%;top:50%;width:10vmin;height:10vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffffffbb 0%,#d9f2ff66 15%,#acdfff22 40%,transparent 70%);filter:blur(2px);pointer-events:none}.energy-point::after{content:"";position:absolute;left:50%;top:50%;width:8vmin;height:8vmin;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent 0%,#e9f7ff99 48%,#fff 50%,#e9f7ff99 52%,transparent 100%),linear-gradient(0deg,transparent 0%,#e9f7ff99 48%,#fff 50%,#e9f7ff99 52%,transparent 100%);mask-image:radial-gradient(circle,#000 0%,#0009 25%,transparent 70%);filter:blur(.5px);pointer-events:none}.growing-point{opacity:1;animation:point-grow .2s ease-out .5s forwards,point-breathe 1s ease-in-out infinite}@keyframes point-appear{to{opacity:1}}@keyframes point-breathe{0%,100%{filter:brightness(1);box-shadow:0 0 1.2vmin .3vmin #e5f5ff88}50%{filter:brightness(2);box-shadow:0 0 2vmin .5vmin #e5f5ffdd}}@keyframes point-grow{to{width:2vmin;height:2vmin}}.triple-rings .ex-energy-ring{animation-duration:.3s}.triple-rings .ring-two{animation-delay:.1s}.triple-rings .ring-three{animation-delay:.2s}@keyframes core-breathe{50%{filter:brightness(1.4);transform:translate(-50%,-50%) scale(1.12)}}@keyframes burst{0%{opacity:.85}100%{opacity:0}}.ex-back-aura{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,#70e8ff00 0deg,#70e8ffff 8deg,#70e8ffff 20deg,#70e8ff00 30deg,#729bff00 40deg,#729bffff 48deg,#729bffff 60deg,#729bff00 70deg,#bb83ff00 80deg,#bb83ffff 88deg,#bb83ffff 100deg,#bb83ff00 110deg,#f382e600 120deg,#f382e6ff 128deg,#f382e6ff 140deg,#f382e600 150deg,#ff829b00 160deg,#ff829bff 168deg,#ff829bff 180deg,#ff829b00 190deg,#ffb97600 200deg,#ffb976ff 208deg,#ffb976ff 220deg,#ffb97600 230deg,#ffe99a00 240deg,#ffe99aff 248deg,#ffe99aff 260deg,#ffe99a00 270deg,#98efaa00 280deg,#98efaaff 288deg,#98efaaff 300deg,#98efaa00 310deg,#76efd500 320deg,#76efd5ff 328deg,#76efd5ff 340deg,#76efd500 350deg,#70e8ff00 360deg);filter:blur(7px) brightness(1.05);opacity:.6;mask-image:radial-gradient(circle,transparent 0%,#000b 9%,#000 18%,#0008 30%,transparent 49%);pointer-events:none;z-index:1;animation:aura-appear .3s ease-out both,aura-rotate 24s linear infinite reverse}@keyframes aura-rotate{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes aura-appear{from{opacity:0}to{opacity:1}}.rays{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;background:repeating-conic-gradient(from 0deg,#fff 0deg 4deg,transparent 10deg 24deg);mask-image:radial-gradient(circle,#000 0%,#0009 22%,transparent 55%);animation:rays-in .3s ease-out both,spin 22s linear infinite;pointer-events:none;z-index:1}@keyframes rays-in{from{opacity:0}to{opacity:.9}}@keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}.reward{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;animation:item-in .3s ease-out both}.reward{isolation:isolate}.silhouette-halo{position:absolute;left:50%;top:50%;width:min(40vmin,330px);height:min(40vmin,330px);transform:translate(-50%,-50%);z-index:-1;filter:blur(7px);pointer-events:none}.silhouette-halo span{position:absolute;inset:-2%;background:conic-gradient(#ff80b5,#ffd45a,#84ff9b,#60e7ff,#9390ff,#e681ff,#ff80b5);-webkit-mask:var(--outline-mask) center/contain no-repeat;mask:var(--outline-mask) center/contain no-repeat}.silhouette-halo::after{content:"";position:absolute;inset:0;background:conic-gradient(#ff80b5,#ffd45a,#84ff9b,#60e7ff,#9390ff,#e681ff,#ff80b5);-webkit-mask:var(--outline-mask) center/contain no-repeat;mask:var(--outline-mask) center/contain no-repeat;filter:blur(13px);opacity:.8}.ex-surface-glow{position:absolute;left:50%;top:50%;width:min(40vmin,330px);height:min(40vmin,330px);transform:translate(-50%,-50%);pointer-events:none;-webkit-mask:var(--surface-mask) center/contain no-repeat;mask:var(--surface-mask) center/contain no-repeat;mix-blend-mode:screen;opacity:.9}.ex-surface-glow::before{content:"";position:absolute;inset:-25%;background:conic-gradient(from 0deg,#ff57cdee,#a34dffee,#24dfff,#42ffc9ee,#fff6ccee,#ff57cdee);filter:saturate(1.5) brightness(1.2);animation:surface-color-rotate 8s linear infinite;-webkit-mask-image:url("./assets/ui/ex-flow-noise.svg");mask-image:url("./assets/ui/ex-flow-noise.svg");-webkit-mask-size:100% 100%;mask-size:100% 100%}.ex-surface-glow::after{content:"";position:absolute;inset:-25%;background:conic-gradient(#fff0,#cceeff88,#fff0,#ffddee77,#fff0);-webkit-mask-image:url("./assets/ui/ex-flow-noise.svg");mask-image:url("./assets/ui/ex-flow-noise.svg");-webkit-mask-size:100% 100%;mask-size:100% 100%;opacity:.55;animation:surface-color-rotate 13s linear infinite reverse}@keyframes surface-color-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes item-in{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}.hud{position:fixed;z-index:10;left:16px;right:16px;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#071027dd;border:1px solid #ffffff40;border-radius:12px;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap}.hud button,.hud a{border:1px solid #ffffff66;background:#172744;color:#fff;border-radius:6px;padding:7px 12px;text-decoration:none}.hud button[aria-pressed=true]{background:#675021;border-color:#ffe6a1}#status{line-height:1.8}#cooldown{color:#b9d6ff;font-size:11px}.label{position:fixed;z-index:10;top:16px;left:16px;background:#0007;padding:7px 12px;border-radius:6px;font-size:12px;pointer-events:none}@media(max-width:600px){.hud{align-items:flex-start;flex-direction:column}.hud button,.hud a{padding:7px 10px}}@media(prefers-reduced-motion:reduce){.ex-back-aura{animation:none}.ex-surface-glow::before,.ex-surface-glow::after{animation:none}.ex-focus,.ex-energy-core,.ex-energy-ring,.ex-burst,.energy-cloud .ex-energy-core,.energy-wave,.energy-point,.growing-point{animation:none}.energy-point{opacity:1}.growing-point{width:2vmin;height:2vmin}.rainbow{animation:none;transform:translate(-50%,-50%)}.rays{animation:none;transform:translate(-50%,-50%)}.reward{animation:none}}

@property --outline-angle{syntax:"<angle>";initial-value:0deg;inherits:true}
@keyframes outline-color-orbit{to{--outline-angle:360deg}}
@keyframes rare-item-float{0%,100%{translate:0 0;rotate:-1deg}50%{translate:0 -9px;rotate:1deg}}
@keyframes starfield-arrive{from{transform:scale(3)}to{transform:scale(1)}}

.starfield-layer{position:absolute;inset:0;background:#020611 url("./assets/ui/reveal-starfield.svg") center/cover no-repeat;pointer-events:none;animation:starfield-arrive .2s ease-out both}
.reward{animation:item-in .3s ease-out both,rare-item-float 6s ease-in-out infinite}
.silhouette-halo{animation:outline-color-orbit 8s linear infinite}
.silhouette-halo span,.silhouette-halo::after{background:conic-gradient(from var(--outline-angle),#ff80b5,#ffd45a,#84ff9b,#60e7ff,#9390ff,#e681ff,#ff80b5)}
@media(prefers-reduced-motion:reduce){.starfield-layer,.reward,.silhouette-halo{animation:none}}

.reveal-final-wave{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%);border:3px solid #f0faff;border-radius:50%;box-shadow:0 0 15px #d1ecffbb,inset 0 0 12px #d1ecff88;z-index:3;pointer-events:none;animation:reveal-final-expand .5s ease-out both}
@keyframes reveal-final-expand{0%{width:0;height:0;opacity:1}65%{opacity:.8}100%{width:150vmax;height:150vmax;opacity:0}}
@media(prefers-reduced-motion:reduce){.reveal-final-wave{display:none}}
body.reduce-motion .reveal-final-wave{display:none}


.multi-energy-rings .ex-energy-ring{border-width:3px;border-color:var(--energy-color);box-shadow:0 0 14px var(--energy-color),0 0 28px var(--energy-color),inset 0 0 12px var(--energy-color)}
.multi-energy-rings .energy-point:not(.growing-point){animation-delay:.48s,.48s}

.multi-energy-rings.wide-color-rings .ex-energy-ring{border-width:3px}

.multi-energy-rings.wide-color-rings .ex-energy-ring{border:0;padding:3px;background:conic-gradient(from var(--ring-gradient-angle,0deg),#ff354f,#ffb83d,#54ff8f,#47dfff,#6685ff,#ce6aff,#ff354f);box-shadow:none;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;filter:brightness(1.6)}

.reveal-final-wave.ex-rainbow-wave{border:0;padding:5px;background:conic-gradient(#ff354f,#ffb83d,#54ff8f,#47dfff,#6685ff,#ce6aff,#ff354f);box-shadow:none;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;filter:brightness(1.5)}

/* Feather both contracting and expanding energy rings. */
.ex-energy-ring,.reveal-final-wave{filter:blur(1.5px)}
.multi-energy-rings.wide-color-rings .ex-energy-ring{filter:blur(1.5px) brightness(1.6)}
.reveal-final-wave.ex-rainbow-wave{filter:blur(2px) brightness(1.5)}
</style></head><body>

<div id="scene" role="button" tabindex="0" aria-label="点击推进揭示动画"></div><div class="label">独立预览 · 未接入游戏</div>
<div class="hud"><div><div id="status" role="status" aria-live="polite">资源加载中…</div><div id="cooldown">点击冷却 0.5 秒</div></div><div class="controls"><button id="seven" aria-pressed="true">7 级</button><button id="ex" aria-pressed="false">EX</button><button id="reset">重播</button><button id="sound" aria-pressed="true">声音：开</button><a href="./stepped-reveal-preview.html?v=musiclab-brass-v14">音效试听</a></div></div>
