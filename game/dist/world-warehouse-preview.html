<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>超长手机仓库检查</title><link rel="stylesheet" href="./style.css"><style>body{display:block;overflow:auto;padding:24px;background:#102b3c;color:#ffedbe}.warehouse-grid{--cell:40px;position:relative;display:grid;grid-template-columns:repeat(20,40px);grid-auto-rows:40px;width:800px;min-width:800px;margin:24px 0;background:repeating-linear-gradient(0deg,transparent 0 39px,#436079 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#436079 39px 40px)}h1{font:24px system-ui}</style><h1>iPhone18 · 1×9竖放与9×1横放</h1><div class="warehouse-grid"></div><script type="module">import{makeItems,itemSVG}from'./content.js';import{packWarehouse}from'./warehouse.js';const e=await(await fetch('./economy.json')).json(),items=makeItems(e),id='g6-w18';const state={inventory:{[id]:{qty:2}},warehousePositions:{[id+'#0']:{x:0,y:0},[id+'#1']:{x:2,y:0,rotated:true}}};const layout=packWarehouse(state,items);document.querySelector('.warehouse-grid').style.gridTemplateRows=`repeat(${layout.rows},40px)`;document.querySelector('.warehouse-grid').innerHTML=layout.placed.map(p=>`<button class="warehouse-item ${p.rotated?'item-rotated':''}" data-grade="6" style="--quality-color:#ff263e;--footprint-width:${p.width};--footprint-height:${p.height};grid-column:${p.x+1}/span ${p.width};grid-row:${p.y+1}/span ${p.height}" aria-label="${p.rotated?'横放':'竖放'}iPhone18">${itemSVG(items[id])}</button>`).join('');</script></html>
