<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>世界藏品贴图预览</title><link rel="stylesheet" href="./style.css"><style>body{display:block;overflow:auto;padding:24px;background:#102b3c;color:#ffedbe;font:16px system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,240px));gap:16px}article{padding:14px;text-align:center;background:#183746;border-radius:12px}article .art{height:180px;display:flex;align-items:center;justify-content:center}article img{max-width:100%;max-height:160px;object-fit:contain}h2{font-size:18px}small{color:#c8d9df}</style><h1>世界藏品 · 透明贴图与品质光效</h1><main></main><script type="module">import{makeItems,lootArt,gradeNames,lootColors}from'./content.js';const e=await(await fetch('./economy.json')).json();document.querySelector('main').innerHTML=Object.values(makeItems(e)).filter(i=>i.texture?.includes('/world-')).map(i=>`<article data-grade="${i.grade}" style="--loot-color:${lootColors[i.grade-1]}"><small>${i.grade}级 · ${gradeNames[i.grade-1]} · ${i.footprint.join('×')}</small><div class="art treasure-item" data-grade="${i.grade}" style="--loot-color:${lootColors[i.grade-1]};width:100%;animation:none">${lootArt(i)}</div><h2>${i.name}</h2></article>`).join('');</script></html>
